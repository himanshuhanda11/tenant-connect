<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Cache-busting: never cache the HTML shell so users always fetch the latest hashed assets -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="theme-color" content="#25D366" />
    <meta name="facebook-domain-verification" content="ljofj1ncybdywrqon6flm5a0v65df3" />

    <!-- Default SEO Meta (overridden per-page by react-helmet-async) -->
    <title>AiReatro Communications — WhatsApp Business API Platform</title>
    <meta name="description" content="Connect, engage, and grow with WhatsApp Business API. Automate conversations, send campaigns, manage team inbox, and build chatbots with AiReatro." />

    <!-- Default Open Graph -->

    <!-- Default Twitter -->

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.png" />
    <link rel="mask-icon" href="/logo.svg" color="#25D366" />

    <!-- Resource hints: warm up Supabase + Google Fonts connections -->
    <link rel="preconnect" href="https://fygwjpdasnhaomoqdvcu.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://fygwjpdasnhaomoqdvcu.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload the initial loader logo so first paint isn't blocked -->
    <link rel="preload" as="image" href="/aireatro-logo.png" fetchpriority="high" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>

  <body>
    <div id="root">
      <!-- Initial branded loader — replaced immediately when React mounts -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      ">
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
          <div style="
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34,197,94,0.18) 0%, rgba(37,99,235,0.10) 50%, transparent 75%);
            animation: loader-ping 2.2s cubic-bezier(0,0,0.2,1) infinite;
          "></div>
          <img
            src="/aireatro-logo.png"
            alt="AiReatro Communications"
            style="
              position: relative;
              z-index: 1;
              width: 220px;
              height: auto;
              max-width: 70vw;
              animation: loader-float 2.4s ease-in-out infinite;
            "
          />
        </div>
        <div style="
          margin-top: 28px;
          width: 140px;
          height: 3px;
          border-radius: 999px;
          background: rgba(15, 23, 42, 0.08);
          overflow: hidden;
        ">
          <div style="
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #2563eb);
            border-radius: 999px;
            animation: loader-bar 1.4s ease-in-out infinite;
            transform-origin: left;
          "></div>
        </div>
      </div>
      <style>
        @keyframes loader-ping {
          0% { transform: scale(0.85); opacity: 0.7; }
          50% { transform: scale(1.15); opacity: 0.25; }
          100% { transform: scale(0.85); opacity: 0.7; }
        }
        @keyframes loader-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-4px); }
        }
        @keyframes loader-bar {
          0% { transform: scaleX(0); transform-origin: left; }
          50% { transform: scaleX(1); transform-origin: left; }
          51% { transform-origin: right; }
          100% { transform: scaleX(0); transform-origin: right; }
        }
        @media (prefers-color-scheme: dark) {
          #initial-loader { background: #0b0f19 !important; }
        }
      </style>
    </div>
    <script src="/registerSW.js?v=__CACHE_BUST__"></script>
    <!-- Facebook SDK and Razorpay are loaded on-demand from the pages that need them -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
