  <body>
    <div id="root">
      <!-- Initial branded loader — replaced immediately when React mounts -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b0f19;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      ">
        <div style="position: relative; width: 72px; height: 72px;">
          <div style="
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34,197,94,0.25) 0%, transparent 70%);
            animation: loader-ping 2s cubic-bezier(0,0,0.2,1) infinite;
          "></div>
          <svg width="72" height="72" viewBox="0 0 36 36" style="position: relative; z-index: 1;">
            <defs>
              <linearGradient id="ilg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#4ade80"/>
                <stop offset="100%" style="stop-color:#22c55e"/>
              </linearGradient>
            </defs>
            <path d="M18 2C9.163 2 2 8.268 2 16c0 2.74.84 5.29 2.28 7.43L2 34l10.97-2.88A13.86 13.86 0 0 0 18 32c8.837 0 16-6.268 16-14S26.837 2 18 2z" fill="url(#ilg)"/>
            <path d="M14.5 12.5c-.2.6-.1 1.2.3 1.7l.4.5c-.6 1.1-1.4 2.1-2.3 2.9-.9.9-1.9 1.6-2.9 2.3l-.5-.4c-.5-.4-1.1-.5-1.7-.3l-2.2.7c-.6.2-1 .8-1 1.5 0 2.8 2.3 5.1 5.1 5.1.4 0 .7 0 1.1-.1 3.4-.6 6.6-2.3 9-4.7 2.4-2.4 4.1-5.6 4.7-9 .1-.4.1-.7.1-1.1 0-2.8-2.3-5.1-5.1-5.1-.7 0-1.3.4-1.5 1l-.7 2.2z" fill="white"/>
          </svg>
        </div>
        <div style="margin-top: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 800; color: #f8fafc; letter-spacing: -0.02em;">
          AiReatro
        </div>
        <div style="
          margin-top: 16px;
          width: 120px;
          height: 3px;
          border-radius: 999px;
          background: rgba(255,255,255,0.08);
          overflow: hidden;
        ">
          <div style="
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 999px;
            animation: loader-bar 1.2s ease-in-out infinite;
            transform-origin: left;
          "></div>
        </div>
      </div>
      <style>
        @keyframes loader-ping {
          0% { transform: scale(0.85); opacity: 0.6; }
          50% { transform: scale(1.15); opacity: 0.2; }
          100% { transform: scale(0.85); opacity: 0.6; }
        }
        @keyframes loader-bar {
          0% { transform: scaleX(0); }
          50% { transform: scaleX(1); }
          100% { transform: scaleX(0); transform-origin: right; }
        }
      </style>
    </div>
