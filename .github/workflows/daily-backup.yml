name: Daily Database Backup

# Runs every day at 02:00 UTC, and can also be triggered manually.
# Uploads pg_dump output as a GitHub Release asset (no Google Drive required).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # required to create releases / upload assets

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 16 client (pg_dump)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Run pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          echo "STAMP=$STAMP" >> $GITHUB_ENV
          mkdir -p out
          FILE="out/aireatro-backup-${STAMP}.sql.gz"
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "FILE_NAME=$(basename "$FILE")" >> $GITHUB_ENV
          pg_dump \
            --no-owner \
            --no-privileges \
            --clean --if-exists \
            --quote-all-identifiers \
            --schema=public \
            "$SUPABASE_DB_URL" \
            | gzip -9 > "$FILE"
          ls -lh "$FILE"
          echo "FILE_SIZE=$(stat -c%s "$FILE")" >> $GITHUB_ENV

      - name: Publish backup as GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ env.STAMP }}
          name: "DB Backup ${{ env.STAMP }} UTC"
          body: |
            Automated PostgreSQL backup (pg_dump, public schema, gzipped).
            File: `${{ env.FILE_NAME }}`
            Size: ${{ env.FILE_SIZE }} bytes
          files: ${{ env.FILE }}
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log success to backup runs
        if: success()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RELEASE_URL: ${{ fromJSON(steps.release.outputs.assets)[0].browser_download_url }}
          FILE_NAME: ${{ env.FILE_NAME }}
          FILE_SIZE: ${{ env.FILE_SIZE }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO public.platform_backup_runs
            (status, trigger, drive_status, drive_file_id, drive_web_link, storage_path, file_size_bytes, completed_at)
          VALUES
            ('success', 'github_action', 'uploaded',
             'github-release-${{ env.STAMP }}',
             '${RELEASE_URL}',
             '${FILE_NAME}', ${FILE_SIZE}, now());
          SQL

      - name: Log failure to backup runs
        if: failure()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL || true
          INSERT INTO public.platform_backup_runs
            (status, trigger, drive_status, drive_error, error_message, completed_at)
          VALUES
            ('failed', 'github_action', 'failed',
             'GitHub Action failed - see workflow run ${{ github.run_id }}',
             'GitHub Action failed - see workflow run ${{ github.run_id }}',
             now());
          SQL
